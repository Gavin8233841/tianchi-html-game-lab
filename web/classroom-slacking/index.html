<!doctype html>
<html lang='zh-CN'>
  <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'>
    <meta name='theme-color' content='#1f4742'>
    <title>课桌下的宇宙</title>
    <link rel='stylesheet' href='style.css'>
  </head>
  <body>
    <main id='game-shell' aria-label='课桌下的宇宙游戏'>
      <canvas id='classroom' aria-label='初中教室场景'></canvas>
      <header id='hud' class='hud is-hidden' aria-live='polite'>
        <div class='hud-item score-box'><span>脑洞值</span><strong id='score'>0</strong></div>
        <div class='hud-item lesson-box'><span id='lesson-count'>第 1 节 / 3</span><strong id='lesson-name'>数学课</strong></div>
        <div class='hud-item time-box'><span>距离下课</span><strong id='time-left'>0:34</strong></div>
        <div class='hud-item suspicion-box'><span>老师怀疑</span><strong id='suspicion-value'>0</strong><i class='meter'><b id='suspicion-fill'></b></i></div>
        <div class='hud-item strike-box'><span>纪律记录</span><strong id='strikes' aria-label='零次被抓'><i></i><i></i><i></i></strong></div>
        <div class='lesson-progress' aria-hidden='true'><i id='lesson-progress-fill'></i></div>
      </header>
      <div id='danger-cues' class='danger-cues' aria-live='assertive'>
        <div class='danger-cue' data-watcher='teacher'><b>!</b><span>老师要回头了</span></div>
        <div class='danger-cue' data-watcher='corridor'><b>!</b><span>走廊有脚步</span></div>
        <div class='danger-cue' data-watcher='monitor'><b>!</b><span>班长在看你</span></div>
      </div>
      <div id='banner' class='banner' aria-live='assertive'></div>
      <div id='desk-controls' class='desk-controls is-hidden'>
        <div id='hold-prompt' class='hold-prompt'>动起来</div>
        <div class='action-row'>
          <button id='stow-tool' type='button' title='空格或 Esc'>收好</button>
          <div id='doodle-actions' class='action-group is-hidden'>
            <button id='doodle-undo' type='button' title='Z'>撤销</button>
            <button id='doodle-clear' type='button'>清空</button>
          </div>
          <div id='plane-actions' class='action-group is-hidden'>
            <button type='button' data-throw='short'>短投 +80</button>
            <button type='button' data-throw='far'>远投 +260</button>
          </div>
          <div id='console-actions' class='action-group is-hidden' aria-label='掌机方向键'>
            <button type='button' data-direction='-1' aria-label='掌机向左'>←</button>
            <button type='button' data-direction='1' aria-label='掌机向右'>→</button>
          </div>
        </div>
        <nav id='tool-dock' class='tool-dock' aria-label='桌面装备'>
        <button class='tool-button' type='button' data-tool='spin'><b>↻</b><span>转笔</span></button>
        <button class='tool-button' type='button' data-tool='doodle'><b>✎</b><span>涂鸦</span></button>
        <button class='tool-button' type='button' data-tool='note'><b>▱</b><span>纸条</span></button>
        <button class='tool-button' type='button' data-tool='snack'><b>◒</b><span>零食</span></button>
        <button class='tool-button' type='button' data-tool='comic'><b>▤</b><span>漫画</span></button>
        <button class='tool-button' type='button' data-tool='plane'><b>➤</b><span>纸飞机</span></button>
        <button class='tool-button' type='button' data-tool='console'><b>▣</b><span>掌机</span></button>
        </nav>
      </div>
      <button id='sound-toggle' class='icon-button' type='button' aria-label='关闭声音' title='声音'>♪</button>
      <section id='screen' class='screen'>
        <div class='screen-copy intro-copy'>
          <p class='eyebrow'>初中 · 课堂生存</p>
          <h1>课桌下的宇宙</h1>
          <p class='tagline'>老师转身以后，一节课可以很长。</p>
          <button id='start-button' class='primary-button' type='button'>开始上课</button>
          <p id='best-score' class='best-score'></p>
        </div>
      </section>
    </main>
    <script type='module' src='game.js'></script>
  </body>
</html>
